name: KT3 evaluation

on:
  push:
    branches: [kt3/metrics]
    paths: ['kt3/request.json']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kt3-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check OpenRouter access
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python kt3/check_connection.py
      - name: Save results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kt3-${{ github.run_id }}
          path: runs/
          retention-days: 14
